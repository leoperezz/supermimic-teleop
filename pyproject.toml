[build-system]
requires = ["uv_build>=0.8.19,<0.9.0"]
build-backend = "uv_build"

[project]
name = "supermimic"
version = "0.1.0"
description = "Humanoid whole-body motion tracking with one differentiable world model."
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE"]
requires-python = ">=3.13,<3.14"
dependencies = [
    "huggingface-hub>=2.4.0",
    "joblib>=1.6.0",
    "matplotlib>=3.10.8",
    "mjlab",
    "onnxruntime>=1.32.0",
    "pandas>=3.1.1",
    "python-dotenv>=1.2.4",
    "pyyaml>=6.0.3",
    "ruff>=0.14.10",
    "scipy>=1.17.0",
    "torch>=2.14.0,<2.15",
    "viser>=1.0.24",
    "wandb>=0.31.0,<0.32",
    "warp-lang==1.19.0",
]

[tool.uv.sources]
mjlab = { path = "../mjlab_research", editable = true }
torch = { index = "pytorch-cu126", marker = "sys_platform == 'linux' and platform_machine == 'x86_64'" }
# Warp's default wheels require CUDA 13; use the official CUDA 12 build here.
warp-lang = { url = "https://github.com/NVIDIA/warp/releases/download/v1.19.0/warp_lang-1.19.0%2Bcu12-py3-none-manylinux_2_28_x86_64.whl", marker = "sys_platform == 'linux' and platform_machine == 'x86_64'" }

[[tool.uv.index]]
name = "pytorch-cu126"
url = "https://download.pytorch.org/whl/cu126"
explicit = true

[tool.ruff]
src = ["src"]
indent-width = 2
exclude = []

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "B"]
ignore = ["B011"]

[tool.pyright]
pythonVersion = "3.13"
venvPath = "."
venv = ".venv"
include = ["src"]

[dependency-groups]
dev = [
    "ipdb>=0.13.13",
    "pre-commit>=4.2.0",
    "pyright>=1.1.408",
    "pytest>=9.0.2",
]
